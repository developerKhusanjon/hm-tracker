version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hm_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hm_tracker
      DB_USER: postgres
      DB_PASSWORD: password
    restart: unless-stopped

volumes:
  postgres_data: